# PR-mode trusted-base workflow test (issue #77).
#
# Runs the PR-mode test fixture proving that PR-mode evaluates policy from the base commit.

name: PR Mode

on:
  pull_request:

permissions:
  contents: read

jobs:
  pr-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --quiet . pytest

      - name: Run PR mode fixture test
        run: python -m pytest tests/unit/test_workflow_pr_mode.py
